name: eval

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Search quality and answer grounding on the committed fixture
        # The fixture (UVA data) is committed only once the archive approves it.
        if: hashFiles('tests/fixtures/search/baseline.json') != ''
        run: python -m hfa.ci_check
